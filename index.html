<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Jana ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <div id="desktopMessage">

    <div class="desktopBox">

        <div class="desktopIcon">📱</div>

        <h1>Mobile Only ❤️</h1>

        <p>
            This surprise is made especially for mobile.
        </p>

        <span>
            Please open it on your phone.
        </span>

    </div>

</div>

    <div id="passwordScreen">

    <div class="passwordBox">

        <div class="passwordHeart">❤️</div>

        <h1>Private Surprise</h1>

        <p>Enter the password to continue</p>

        <input
            type="password"
            id="passwordInput"
            placeholder="Enter password"
        >

        <button id="passwordBtn">
            Unlock ❤️
        </button>

        <p id="passwordMessage"></p>

    </div>

</div>

    <div id="lockScreen">

    <h1>❤️ A Special Surprise ❤️</h1>

    <p>This surprise will unlock on</p>

    <h2>August 1st 🎂</h2>

    <div id="countdown"></div>

    <button id="lockBtn">🔒 Open</button>

    <p id="lockMessage"></p>

</div>

<div id="websiteContent">

<div class="background">
    <div class="stars"></div>
</div>

<div class="container">

    <div class="heart">❤️</div>

    <h1>Happy Birthday</h1>

    <h2>Jana</h2>

    <p>A little surprise made especially for you.</p>

    <button id="openBtn">
        Open Your Surprise
    </button>

</div>

<script src="script.js"></script>

</body>

</html>
